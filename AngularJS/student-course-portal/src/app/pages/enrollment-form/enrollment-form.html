<h2>Student Enrollment Form</h2>

<form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">

    <label>Student Name</label>

    <input type="text" name="studentName" [(ngModel)]="studentName" required minlength="3" #nameCtrl="ngModel">

    <div *ngIf="nameCtrl.touched">

        <span *ngIf="nameCtrl.errors?.['required']">

            Name is required

        </span>

        <span *ngIf="nameCtrl.errors?.['minlength']">

            Name must be at least 3 characters

        </span>

    </div>

    <br>

    <label>Email</label>

    <input type="email" name="studentEmail" [(ngModel)]="studentEmail" required email #emailCtrl="ngModel">

    <div *ngIf="emailCtrl.touched">

        <span *ngIf="emailCtrl.errors?.['required']">

            Email is required

        </span>

        <span *ngIf="emailCtrl.errors?.['email']">

            Enter a valid email

        </span>

    </div>

    <br>

    <label>Course ID</label>

    <input type="number" name="courseId" [(ngModel)]="courseId" required #courseCtrl="ngModel">

    <div *ngIf="courseCtrl.touched">

        <span *ngIf="courseCtrl.errors?.['required']">

            Course ID is required

        </span>

    </div>

    <br>

    <label>Preferred Semester</label>

    <select name="preferredSemester" [(ngModel)]="preferredSemester">

        <option value="">Select</option>
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>

    </select>

    <br><br>

    <label>

        <input type="checkbox" name="agreeToTerms" [(ngModel)]="agreeToTerms" required #termsCtrl="ngModel">

        I Agree to Terms

    </label>

    <div *ngIf="termsCtrl.touched">

        <span *ngIf="termsCtrl.errors?.['required']">

            Please accept the terms

        </span>

    </div>

    <br><br>

    <button type="submit" [disabled]="enrollForm.invalid">

        Submit

    </button>

    <button type="button" (click)="enrollForm.resetForm()">

        Reset

    </button>

</form>

<div *ngIf="submitted">

    <h3 style="color:green">

        Enrollment request submitted successfully!

    </h3>

</div>
